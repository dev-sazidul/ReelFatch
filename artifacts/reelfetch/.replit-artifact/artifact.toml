kind = "web"
previewPath = "/"
title = "ReelFetch"
description = "A responsive, mobile-first interface for checking authorized Facebook Reel and video download options, with clear demo states and supporting information pages."
version = "1.0.0"
id = "artifacts/reelfetch"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21810

[services.development]
run = "pnpm --filter @workspace/reelfetch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reelfetch", "run", "build" ]
serve = "static"
publicDir = "artifacts/reelfetch/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21810"
BASE_PATH = "/"
