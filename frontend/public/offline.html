<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e63b8" />
    <title>Offline | ReelFetch</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fcfaf8;
        color: #16213c;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #1e63b8;
        color: white;
        font-size: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.04em; }
      p { margin: 0 0 20px; color: #5c6570; }
      button, a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 10px;
        background: #1e63b8;
        color: white;
        font: 700 14px system-ui, sans-serif;
        text-decoration: none;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↓</div>
      <h1>You are offline</h1>
      <p>ReelFetch needs a connection to check a video link. Reconnect, then try the page again. Saved videos are not stored in the app.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
