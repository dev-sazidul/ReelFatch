<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReelFetch Video Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M11 3h2v10.2l3.3-3.3 1.4 1.4L12 17.1 6.3 11.3l1.4-1.4 3.3 3.3V3zM5 19h14v2H5z" />
          </svg>
        </span>
        <div>
          <p class="name">ReelFetch</p>
          <p class="product">Video Downloader</p>
        </div>
      </header>

      <section class="card" aria-labelledby="status-heading">
        <div class="card-row">
          <h1 id="status-heading">This page</h1>
          <p id="status-pill" class="pill" data-state="loading">Checking</p>
        </div>
        <p id="platform-name" class="platform">Reading the current tab</p>
        <p id="page-url" class="url">Looking up the address of this tab.</p>
      </section>

      <p id="message" class="message" role="status"></p>

      <div class="actions">
        <button id="download" class="primary" type="button" disabled>Download Video</button>
        <button id="confirm-open" class="primary" type="button" hidden>Open ReelFetch with this link</button>
        <button id="confirm-cancel" class="secondary" type="button" hidden>Cancel</button>
        <button id="open-site" class="secondary" type="button">Open ReelFetch Website</button>
        <button id="copy" class="ghost" type="button" disabled>Copy current video URL</button>
      </div>

      <label class="preference">
        <input id="confirm" type="checkbox" />
        Ask before opening ReelFetch
      </label>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
